name: Build Nexa Vision AI APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Create isolated exporter environment
        run: |
          python -m venv .export-venv
          . .export-venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install ultralytics==8.4.144
          python -m pip install litert-torch==0.9.4 ai-edge-litert==2.2.0
          python - <<'PY'
          import torch
          import ultralytics
          import litert_torch
          print('torch:', torch.__version__)
          print('ultralytics:', ultralytics.__version__)
          print('litert_torch:', getattr(litert_torch, '__version__', 'installed'))
          PY

      - name: Export YOLO11x-Pose to LiteRT FP32
        run: |
          . .export-venv/bin/activate
          python - <<'PY'
          from ultralytics import YOLO

          model = YOLO('yolo11x-pose.pt')
          exported = model.export(
              format='litert',
              imgsz=640,
              batch=1,
              device='cpu',
              half=False,
              dynamic=False,
          )
          print('Exported:', exported)
          PY

          MODEL=$(find . -type f -name 'yolo11x-pose.tflite' -print -quit)
          if [ -z "$MODEL" ]; then
            echo 'ERROR: yolo11x-pose.tflite was not produced.'
            find . -type f \( -name '*.tflite' -o -name '*.litert' \) -print
            exit 1
          fi

          mkdir -p app/src/main/assets
          cp "$MODEL" app/src/main/assets/yolo11x-pose.tflite
          ls -lh app/src/main/assets/yolo11x-pose.tflite

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 9.5.1
        run: |
          set -euo pipefail
          GRADLE_VERSION='9.5.1'
          DIST_DIR="$RUNNER_TEMP/gradle-dist"
          INSTALL_DIR="$RUNNER_TEMP/gradle-$GRADLE_VERSION"
          ARCHIVE="$RUNNER_TEMP/gradle-$GRADLE_VERSION-bin.zip"

          if [ ! -x "$INSTALL_DIR/bin/gradle" ]; then
            rm -rf "$DIST_DIR" "$INSTALL_DIR"
            mkdir -p "$DIST_DIR"
            curl -fL --retry 5 --retry-delay 2 --retry-all-errors \
              "https://services.gradle.org/distributions/gradle-$GRADLE_VERSION-bin.zip" \
              -o "$ARCHIVE"
            unzip -q "$ARCHIVE" -d "$DIST_DIR"
            test -x "$DIST_DIR/gradle-$GRADLE_VERSION/bin/gradle"
            mv "$DIST_DIR/gradle-$GRADLE_VERSION" "$INSTALL_DIR"
          fi

          echo "$INSTALL_DIR/bin" >> "$GITHUB_PATH"
          "$INSTALL_DIR/bin/gradle" --version

      - name: Build debug APK
        run: |
          gradle :app:assembleDebug --no-daemon --stacktrace --no-build-cache

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nexa-Vision-AI-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
